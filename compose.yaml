name: anime-pilgrimage-agent

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: pilgrimage
      POSTGRES_USER: pilgrimage
      POSTGRES_PASSWORD: pilgrimage
    volumes:
      - pilgrimage-postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilgrimage -d pilgrimage"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://pilgrimage:pilgrimage@postgres:5432/pilgrimage
      RAG_BM25_INDEX_DIR: /app/data/rag-bm25
      RAG_EMBEDDING_MODE: real
      HF_HOME: /app/data/huggingface
      MCP_TOOLS_URL: http://mcp-tools:8001/mcp
    volumes:
      - pilgrimage-rag-index:/app/data/rag-bm25
      - pilgrimage-hf-cache:/app/data/huggingface
    command: ["sh", "-c", "alembic upgrade head && uvicorn pilgrimage_agent.api.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mcp-tools:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 4s
      timeout: 3s
      retries: 20
    networks: [frontend, backend]

  mcp-tools:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://pilgrimage:pilgrimage@postgres:5432/pilgrimage
      PROVIDER_MODE: ${PROVIDER_MODE:-fixture}
      PILGRIMAGE_POINT_MODE: ${PILGRIMAGE_POINT_MODE:-anitabi}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8001),2); s.close()"]
      interval: 4s
      timeout: 3s
      retries: 20
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "4173:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 4s
      timeout: 3s
      retries: 20
    networks: [frontend]

volumes:
  pilgrimage-postgres:
    name: anime-pilgrimage-agent-postgres
  pilgrimage-rag-index:
    name: anime-pilgrimage-agent-rag-index
  pilgrimage-hf-cache:
    name: anime-pilgrimage-agent-hf-cache

networks:
  frontend:
  backend:
